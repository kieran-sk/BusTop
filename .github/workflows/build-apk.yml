name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BusTop-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Release APK on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: BusTop Android v1.0.${{ github.run_number }}
          body: |
            ### 🚍 BusTop Android APK Release
            - Αυτόματο build από GitHub Actions
            - Υποστήριξη Live Android Notifications & Split-Flap Ticker
            - Αυτόματη σύνδεση με την παραγωγική έκδοση Cloudflare Pages
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}