name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Release Notes
        id: release_notes
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          # Extract commit title and body
          COMMIT_MSG=$(git log -1 --pretty=%B)
          
          # Generate changelog of recent commits
          RECENT_COMMITS=$(git log -5 --pretty=format:"* %s (%h)")
          
          cat << 'EOF' > release_body.md
          ### 🚍 BusTop Android Release ${{ env.VERSION }}
          
          #### 📝 Changes in this release:
          EOF
          echo "$COMMIT_MSG" >> release_body.md
          cat << 'EOF' >> release_body.md
          
          #### 📜 Recent Commits:
          EOF
          echo "$RECENT_COMMITS" >> release_body.md
          cat << 'EOF' >> release_body.md
          
          ---
          **Download**: Install `BusTop-v1.0.${{ github.run_number }}.apk` below.
          EOF

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug -PbuildNumber=${{ github.run_number }} --stacktrace
          
          # Move and ensure file is named bustop-v1.0.<version>.apk
          cd app/build/outputs/apk/debug
          APK_FILE=$(ls *.apk | head -n 1)
          if [ "$APK_FILE" != "bustop-v1.0.${{ github.run_number }}.apk" ]; then
            mv "$APK_FILE" "bustop-v1.0.${{ github.run_number }}.apk"
          fi
          echo "Built APK: bustop-v1.0.${{ github.run_number }}.apk"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bustop-v1.0.${{ github.run_number }}-APK
          path: android/app/build/outputs/apk/debug/bustop-v1.0.${{ github.run_number }}.apk

      - name: Release APK on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: BusTop Android v1.0.${{ github.run_number }}
          body_path: release_body.md
          files: android/app/build/outputs/apk/debug/bustop-v1.0.${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}