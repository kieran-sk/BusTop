name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Release Notes
        id: release_notes
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          # Extract commit title and body
          COMMIT_MSG=$(git log -1 --pretty=%B)
          
          # Generate changelog of recent commits
          RECENT_COMMITS=$(git log -5 --pretty=format:"* %s (%h)")
          
          cat << 'EOF' > release_body.md
          ### 🚍 BusTop Android Release ${{ env.VERSION }}
          
          #### 📝 Changes in this release:
          EOF
          echo "$COMMIT_MSG" >> release_body.md
          cat << 'EOF' >> release_body.md
          
          #### 📜 Recent Commits:
          EOF
          echo "$RECENT_COMMITS" >> release_body.md
          cat << 'EOF' >> release_body.md
          
          ---
          **Download**: Install `BusTop-v1.0.${{ github.run_number }}.apk` below.
          EOF

      - name: Build Android Debug APKs (Phone + Wear OS)
        working-directory: ./android
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew :app:assembleDebug :wear:assembleDebug -PbuildNumber=${{ github.run_number }} --stacktrace
          
          # Prepare Phone APK
          cp app/build/outputs/apk/debug/*.apk "bustop-v1.0.${{ github.run_number }}.apk"
          echo "Built Phone APK: bustop-v1.0.${{ github.run_number }}.apk"

          # Prepare Wear OS APK
          cp wear/build/outputs/apk/debug/*.apk bustop-wear.apk
          echo "Built Wear OS APK: bustop-wear.apk"

      - name: Upload Phone APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bustop-v1.0.${{ github.run_number }}-APK
          path: android/bustop-v1.0.${{ github.run_number }}.apk

      - name: Upload Wear OS APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bustop-wear-APK
          path: android/bustop-wear.apk

      - name: Release APKs on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: BusTop Android v1.0.${{ github.run_number }}
          body_path: release_body.md
          files: |
            android/bustop-v1.0.${{ github.run_number }}.apk
            android/bustop-wear.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}