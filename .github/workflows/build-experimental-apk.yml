name: Build Experimental Android APK

on:
  push:
    branches: [ experimental ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Experimental Assets & Package Identity
        run: |
          echo "Configuring standalone experimental APK (com.oasa.athensbus.experimental)..."
          
          # 1. Update Android strings.xml to name app BusTop Exp
          sed -i 's|<string name="app_name">BusTop</string>|<string name="app_name">BusTop Exp</string>|g' android/app/src/main/res/values/strings.xml
          
          # 2. Update Android build.gradle.kts with experimental applicationId
          sed -i 's|applicationId = "com.oasa.athensbus"|applicationId = "com.oasa.athensbus.experimental"|g' android/app/build.gradle.kts
          
          # 3. Update webview initial URL in MainActivity.kt to load experimental Cloudflare deployment
          sed -i 's|https://bustop.pages.dev|https://experimental.bustop.pages.dev|g' android/app/src/main/java/com/oasa/athensbus/MainActivity.kt
          
          cat << 'EOF' > release_body.md
          ### 👾 BusTop Experimental APK (Dot-Matrix Transit Edition)
          
          This is the standalone **Experimental Dot-Matrix Transit Edition** APK!
          - Installs alongside your stable BusTop app without overwriting it (Package: `com.oasa.athensbus.experimental`)
          - Pre-configured to point directly to `https://experimental.bustop.pages.dev`
          - Includes authentic Athens transit LED matrix typography, phosphor & amber status colors, and physical tactile buttons.
          
          ---
          **Download**: Install `bustop-experimental.apk` below.
          EOF

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          
          cd app/build/outputs/apk/debug
          APK_FILE=$(ls *.apk | head -n 1)
          cp "$APK_FILE" bustop-experimental.apk
          echo "Built APK: bustop-experimental.apk"

      - name: Release Experimental APK on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: experimental-latest
          name: BusTop Experimental (Dot-Matrix Edition)
          body_path: release_body.md
          files: android/app/build/outputs/apk/debug/bustop-experimental.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
